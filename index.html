<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 20px;
    }

    .container {
        width: 80%;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px gray;
    }

    h1 {
        text-align: center;
        color: #333;
    }

    .form-group {
        text-align: center;
        margin-bottom: 20px;
    }

    input {
        padding: 10px;
        margin: 5px;
        width: 200px;
    }

    button {
        padding: 10px 15px;
        background-color: green;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
    }

    button:hover {
        background-color: darkgreen;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th, td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: center;
    }

    th {
        background-color: #007bff;
        color: white;
    }

    .delete-btn {
        background-color: red;
    }

    .delete-btn:hover {
        background-color: darkred;
    }
</style>
</head>

<body>

<div class="container">
    <h1>Student Management System</h1>

    <div class="form-group">
        <input type="text" id="name" placeholder="Student Name">
        <input type="text" id="usn" placeholder="USN">
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="dept" placeholder="Department">

        <button onclick="addStudent()">Add Student</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>USN</th>
                <th>Email</th>
                <th>Department</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="studentTable">
        </tbody>
    </table>
</div>

<script>

function addStudent() {

    let name = document.getElementById("name").value;
    let usn = document.getElementById("usn").value;
    let email = document.getElementById("email").value;
    let dept = document.getElementById("dept").value;

    if(name === "" || usn === "" || email === "" || dept === "") {
        alert("Please fill all fields!");
        return;
    }

    let table = document.getElementById("studentTable");

    let row = table.insertRow();

    row.insertCell(0).innerHTML = name;
    row.insertCell(1).innerHTML = usn;
    row.insertCell(2).innerHTML = email;
    row.insertCell(3).innerHTML = dept;

    row.insertCell(4).innerHTML =
        '<button class="delete-btn" onclick="deleteStudent(this)">Delete</button>';

    document.getElementById("name").value = "";
    document.getElementById("usn").value = "";
    document.getElementById("email").value = "";
    document.getElementById("dept").value = "";
}

function deleteStudent(button) {
    let row = button.parentNode.parentNode;
    row.remove();
}

</script>

</body>
</html>
